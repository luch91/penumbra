networks:
  default: studionet
  studionet:
    # Studionet enforces a 500-requests/hour RPC limit. A 10-second poll keeps
    # the full live suite below that ceiling while preserving finality waits.
    default_wait_interval: 10000
    default_wait_retries: 50
  localnet:
    url: "http://127.0.0.1:4000/api"
    leader_only: false
  testnet_asimov:
    accounts:
      - "${ACCOUNT_PRIVATE_KEY_1}"
