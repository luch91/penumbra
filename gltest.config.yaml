networks:
  default: studionet
  studionet:
    # Studionet enforces a 500-requests/hour RPC limit. A 60-second poll keeps
    # receipt/finality traffic conservative while retaining a 25-minute wait
    # window per transaction.
    default_wait_interval: 60000
    default_wait_retries: 25
  localnet:
    url: "http://127.0.0.1:4000/api"
    leader_only: false
  testnet_asimov:
    accounts:
      - "${ACCOUNT_PRIVATE_KEY_1}"
